[package]
name = "robosense-airy"
version = "0.1.2"
edition = "2021"
description = "RoboSense Airy (RSAIRY) lidar driver: MSOP/DIFOP/IMU decoding ported from RoboSense's rs_driver, multicast receiver, voxel/decimation filters"
license = "Apache-2.0"
repository = "https://github.com/jeff-hykin/robosense-airy-rust"
readme = "README.md"
keywords = ["lidar", "robosense", "airy", "pointcloud", "robotics"]
categories = ["science::robotics", "hardware-support", "network-programming"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE", "LICENSE-THIRD-PARTY"]

[lib]

[[bin]]
name = "airy-stats"
path = "src/bin/airy-stats.rs"

[dependencies]
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
debug = 1
